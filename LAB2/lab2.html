<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lab 2</title>
</head>
<body>

    <!-- Semantic Tag: header -->
    <header>Personal profile</header>

    <nav>
        <a href="#profile">Profile</a> | <a href="#form">Form</a>
    </nav>
    
    <table border="1">
        <tr>
            <th>Name</th> <th>Age</th> <th>Occupation</th>
        </tr>
        <tr>
            <td>Abdul</td> <td>22</td> <td>Teacher</td>
        </tr>
        <tr>
            <td>Mu'ih</td> <td>28</td> <td>Lecturer</td>
        </tr>
        <tr>
            <td>Aniq</td> <td>30</td> <td>Engineer</td>
        </tr>
    </table>

    <section id="form">
        <h2>Feedback & Registration Form</h2>
        <form action="#" method="post">
            <!-- Text Input: Name -->
            <label for="fname">Name:</label>
            <input type="text" id="fname" name="fullname"><br><br>

            <!-- Text Input: Email -->
            <label for="email">Email:</label>
            <input type="email" id="email" name="user_email"><br><br>

            <!-- Radio Buttons: Gender -->
            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>

            <!-- Checkboxes: Favorite Hobbies -->
            <label>Favorite Hobbies:</label>
            <input type="checkbox" id="hobby1" name="hobby1" value="Sports">
            <label for="hobby1">Sports</label>
            <input type="checkbox" id="hobby2" name="hobby2" value="Gaming">
            <label for="hobby2">Gaming</label>
            <input type="checkbox" id="hobby3" name="hobby3" value="Coding">
            <label for="hobby3">Coding</label><br><br>

            <input type="submit" value="Submit">
        </form>
    </section>

    <br>

    <!-- Semantic Tag: footer -->
    <footer>

    </footer>

</body>
</html>
